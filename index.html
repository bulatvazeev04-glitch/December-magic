<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Адвент-календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#f5ecd7;font-family:system-ui,-apple-system,sans-serif;padding:20px 14px 48px;overflow-x:hidden;
background:radial-gradient(ellipse at 50% -10%,#41307f 0%,#141a45 48%,#0a0d26 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.8;
background:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),radial-gradient(1px 1px at 40% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 40%,#fff,transparent),radial-gradient(1px 1px at 6% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent);animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.9}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#cf{z-index:30}
main{position:relative;z-index:1;max-width:520px;margin:0 auto}
h1{margin:0;text-align:center;font:700 30px Georgia,serif;letter-spacing:.5px;background:linear-gradient(90deg,#f7e6a8,#e8b84a,#fff3c4,#e8b84a,#f7e6a8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.sub{text-align:center;font-size:13px;opacity:.7;margin:6px 0 10px}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:0 18px 20px}
.prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#e8b84a,#fff3c4);transition:width 1s ease .4s}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.c{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;
background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
transition:transform .2s;animation:in .55s both;animation-delay:calc(var(--i)*28ms)}
.c:active{transform:scale(.92)}
.c b,.c small{position:relative;z-index:1}
.c b{font:700 22px Georgia,serif;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.c small{font-size:10px;opacity:.65}
.c .i{position:absolute;top:3px;right:5px;font-size:12px;z-index:1}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.8)}}
.c.future{opacity:.72}
.c.today{background:linear-gradient(145deg,#e8405f,#a3123a);border-color:#ffd77a;animation:in .55s both,glow 2s ease-in-out .9s infinite;animation-delay:calc(var(--i)*28ms),.9s}
.c.today::before,.c.today::after{content:"";position:absolute;background:linear-gradient(#ffe9a8,#d9a23a);opacity:.4}
.c.today::before{left:50%;top:0;bottom:0;width:9px;margin-left:-4.5px}
.c.today::after{top:50%;left:0;right:0;height:9px;margin-top:-4.5px}
@keyframes glow{50%{box-shadow:0 0 22px 3px rgba(255,140,140,.6)}0%,100%{box-shadow:0 0 6px rgba(255,140,140,.25)}}
.c.opened{background:linear-gradient(145deg,#1f8a62,#0f4d3a);border-color:#6be3b0}
.c.missed{background:rgba(70,70,95,.4);filter:grayscale(.8);opacity:.7}
.done .c{animation:none}
.done .c.today{animation:glow 2s ease-in-out infinite}
.pop{animation:pop .6s ease!important}
@keyframes pop{30%{transform:scale(1.3) rotate(-7deg)}60%{transform:scale(.94) rotate(5deg)}}
.shake{animation:shake .4s!important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;opacity:.7;margin-top:22px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,6,20,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:26px 20px 30px;border-radius:26px 26px 0 0;text-align:center;
background:linear-gradient(180deg,#262d68,#141a45);border:1px solid rgba(255,215,122,.45);border-bottom:0;box-shadow:0 -10px 40px rgba(255,200,100,.15);animation:sheet .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes sheet{from{transform:translateY(80px);opacity:0}}
.sheet>*{animation:up .6s both}
.sheet>:nth-child(2){animation-delay:.15s}.sheet>:nth-child(3){animation-delay:.3s}.sheet>:nth-child(4){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.sheet h2{margin:0 0 14px;font:700 24px Georgia,serif;color:#f7e6a8}
.sheet img{width:100%;border-radius:16px;margin-bottom:14px;display:block;animation:reveal 1.1s .15s both;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@keyframes reveal{from{filter:blur(16px);transform:scale(1.12);opacity:0}}
.sheet p{white-space:pre-wrap;font-size:18px;line-height:1.5;margin:0 0 20px}
button{width:100%;border:0;border-radius:14px;padding:15px;font:600 16px system-ui;color:#3a2600;background:linear-gradient(135deg,#ffe9a8,#e8b84a)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas><canvas id="cf"></canvas>
<main>
  <h1 id="h">🎄 Адвент-календарь</h1>
  <div class="sub" id="sub"></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="grid" id="grid"></div>
  <div class="legend"><span>🎁 сегодня</span><span>✅ открыто</span><span>🔒 рано</span><span>💔 потеряно</span></div>
</main>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor("#141a45"); tg.setBackgroundColor("#0a0d26"); } catch {}
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const inTg = !!tg.initData, KEY = "advent_opened";
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;

const store = {
  get: () => new Promise(r => {
    const fb = () => r(JSON.parse(localStorage.getItem(KEY) || "[]"));
    if (!inTg || !tg.CloudStorage) return fb();
    tg.CloudStorage.getItem(KEY, (e, v) => { try { e || !v ? fb() : r(JSON.parse(v)); } catch { fb(); } });
  }),
  set: arr => new Promise(r => {
    const s = JSON.stringify(arr); localStorage.setItem(KEY, s);
    if (inTg && tg.CloudStorage) tg.CloudStorage.setItem(KEY, s, () => r()); else r();
  })
};

const pad = x => String(x).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const day0 = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const nowStr = q.get("today") || ymd(new Date());
const label = n => { const t = new Date((day0(C.start) + n - 1) * 864e5); return pad(t.getUTCDate()) + "." + pad(t.getUTCMonth() + 1); };
const notify = m => inTg ? tg.showAlert(m) : alert(m);
const haptic = t => tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = {today: "🎁", opened: "✅", future: "🔒", missed: "💔"};

let C, opened = [];
const status = n => {
  if (opened.includes(n)) return "opened";
  const d = day0(nowStr) - (day0(C.start) + n - 1);
  return d < 0 ? "future" : d === 0 ? "today" : "missed";
};

function render() {
  let h = "";
  for (let n = 1; n <= C.days; n++) { const s = status(n);
    h += `<div class="c ${s}" data-n="${n}" style="--i:${n}"><span class="i">${ICON[s]}</span><b>${n}</b><small>${label(n)}</small></div>`; }
  $("grid").innerHTML = h;
  $("sub").textContent = `Открыто ${opened.length} из ${C.days}`;
  $("bar").style.width = (opened.length / C.days * 100) + "%";
  setTimeout(() => $("grid").classList.add("done"), 1200 + C.days * 28);
}

function show(n) {
  const c = (C.cells || {})[n] || {};
  const text = c.text || "Сегодня тебя ждёт сюрприз! Приходи ко мне 😉";
  $("sheet").innerHTML = `<h2>🎁 Окошко №${n}</h2>${c.photo ? `<img src="${esc(c.photo)}" onerror="this.remove()">` : ""}<p>${esc(text)}</p><button onclick="closeM()">Закрыть</button>`;
  $("m").classList.add("on");
}
const closeM = () => $("m").classList.remove("on");
$("m").onclick = e => { if (e.target.id === "m") closeM(); };

const wiggle = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

$("grid").onclick = e => {
  const el = e.target.closest(".c"); if (!el) return;
  const n = +el.dataset.n, s = status(n);
  if (s === "future") { haptic("error"); wiggle(el, "shake"); return notify(`Рано 🙈 Это окошко откроется ${label(n)}`); }
  if (s === "missed") { haptic("error"); wiggle(el, "shake"); return notify("💔 Это окошко было доступно только в свой день. Подарок потерян..."); }
  haptic("success");
  if (s === "today") {
    wiggle(el, "pop");
    const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
    opened.push(n); store.set(opened);
    setTimeout(() => { show(n); render(); $("grid").classList.add("done"); }, calm ? 0 : 550);
  } else show(n);
};

// ---- снег ----
const sc = $("snow"), sx = sc.getContext("2d"); let flakes = [];
function fit() { for (const c of [sc, $("cf")]) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; } }
fit(); addEventListener("resize", fit);
if (!calm) {
  for (let i = 0; i < 55; i++) flakes.push({x: Math.random(), y: Math.random(), r: .6 + Math.random() * 2, v: .0006 + Math.random() * .0013, d: Math.random() * 6});
  (function snow(t) {
    sx.clearRect(0, 0, sc.width, sc.height); sx.fillStyle = "rgba(255,255,255,.75)";
    for (const f of flakes) {
      f.y += f.v; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
      sx.beginPath(); sx.arc((f.x + Math.sin(t / 1500 + f.d) * .015) * sc.width, f.y * sc.height, f.r * devicePixelRatio, 0, 7); sx.fill();
    }
    requestAnimationFrame(snow);
  })(0);
}

// ---- конфетти ----
const cc = $("cf"), cx = cc.getContext("2d"); let bits = [], run = false;
function burst(x, y) {
  if (calm) return;
  const k = devicePixelRatio, col = ["#ffd77a", "#ff6b81", "#7bed9f", "#70a1ff", "#fff", "#ffa502"];
  for (let i = 0; i < 80; i++) { const a = Math.random() * 6.28, s = 3 + Math.random() * 8;
    bits.push({x: x * k, y: y * k, vx: Math.cos(a) * s * k, vy: (Math.sin(a) * s - 4) * k, w: (4 + Math.random() * 5) * k, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: col[i % 6], life: 1}); }
  if (!run) { run = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cc.width, cc.height);
  bits = bits.filter(b => b.life > 0 && b.y < cc.height + 30);
  for (const b of bits) {
    b.vy += .35 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.vx *= .985; b.rot += b.vr; b.life -= .008;
    cx.save(); cx.globalAlpha = Math.max(b.life, 0); cx.translate(b.x, b.y); cx.rotate(b.rot);
    cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.w / 4, b.w, b.w / 2); cx.restore();
  }
  bits.length ? requestAnimationFrame(tick) : (run = false);
}

(async () => {
  C = await (await fetch("content.json?" + Date.now())).json();
  $("h").textContent = C.title || "🎄 Адвент-календарь";
  if (q.get("reset")) await store.set([]);
  opened = await store.get();
  render();
})();
</script>
</body>
</html>
