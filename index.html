<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Новогодний адвент-календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{color:#fff;font-family:system-ui,-apple-system,sans-serif;
background:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2.5px) 0 0/28px 28px,linear-gradient(180deg,#0f6140,#0a4a30 55%,#083d28) fixed}
#scroll{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:44px 26px 96px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#cf{z-index:30}
.frame{position:fixed;inset:3px;z-index:5;pointer-events:none;padding:11px;border-radius:22px;background:repeating-linear-gradient(45deg,#d62839 0 12px,#fff 12px 24px);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.lights{position:fixed;top:14px;left:16px;right:16px;height:16px;z-index:4;pointer-events:none}
.lights::before,.lights::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--lc) 0 4px,transparent 5px) 0 0/44px 16px repeat-x;animation:blink 1.6s infinite alternate}
.lights::before{--lc:#ff4d5e}.lights::after{--lc:#ffd166;background-position:22px 0;animation-delay:.8s}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.drift{position:fixed;left:14px;right:14px;bottom:14px;height:34px;z-index:4;pointer-events:none;background:radial-gradient(ellipse 48px 26px at 40px 100%,#fff 97%,transparent) 0 0/80px 34px repeat-x,radial-gradient(ellipse 40px 18px at 0 100%,#eef6f1 97%,transparent) 0 0/80px 34px repeat-x}
main{position:relative;z-index:1;max-width:520px;margin:0 auto}
.hero{display:block;margin:0 auto 4px;width:min(300px,88%);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
h1{margin:0;text-align:center;font:700 29px/1.15 Georgia,serif;text-shadow:0 2px 0 #b3202f,0 0 20px rgba(255,255,255,.3);animation:drop .8s both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.about{text-align:center;font-size:14px;line-height:1.45;opacity:.9;margin:10px 6px 14px;animation:drop .8s .2s both}
.sub{text-align:center;font-size:13px;font-weight:600;margin-bottom:6px}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin:0 14px 22px}
.prog i{display:block;height:100%;width:0;border-radius:9px;background:repeating-linear-gradient(45deg,#d62839 0 8px,#ff7a8a 8px 16px);background-size:23px 23px;animation:stripe 1s linear infinite;transition:width 1s ease .4s}
@keyframes stripe{to{background-position:23px 0}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px}
.c{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;color:#4a2610;border:3px dotted #fffaf0;
background:radial-gradient(circle at 20% 26%,#5a3318 0 2.5px,transparent 3px),radial-gradient(circle at 78% 72%,#5a3318 0 2.5px,transparent 3px),radial-gradient(circle at 76% 22%,#5a3318 0 1.8px,transparent 2.2px),radial-gradient(circle at 26% 80%,#5a3318 0 1.8px,transparent 2.2px),radial-gradient(circle at 35% 30%,#efbd7f,#cf9150 65%,#b8723a);
box-shadow:0 3px 0 #8f5426,0 6px 10px rgba(0,0,0,.35);transition:transform .2s;animation:in .55s both;animation-delay:calc(var(--i)*28ms)}
.c:active{transform:scale(.92)}
.c b{font:700 20px Georgia,serif;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.c small{font-size:9px;font-weight:700;opacity:.7}
.c .i{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.7) rotate(-20deg)}}
.c.future{filter:saturate(.5) brightness(.85);opacity:.8}
.c.today{border-color:#ff4d5e;animation:in .55s both,glow 2s ease-in-out .9s infinite;animation-delay:calc(var(--i)*28ms),.9s}
.c.today .i{font-size:21px;top:-12px;animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translate(-50%,-4px)}}
@keyframes glow{0%,100%{box-shadow:0 3px 0 #8f5426,0 0 8px rgba(255,77,94,.5)}50%{box-shadow:0 3px 0 #8f5426,0 0 24px 5px rgba(255,255,255,.8)}}
.c.opened{background:radial-gradient(circle at 35% 30%,#7be0a6,#2e9e62 65%,#1f7a4a);color:#fff;border-color:#fff;box-shadow:0 3px 0 #145a36,0 6px 10px rgba(0,0,0,.3)}
.c.opened b{text-shadow:0 1px 2px rgba(0,0,0,.4)}
.c.missed{background:radial-gradient(circle at 35% 30%,#c9bfb4,#8d8279);filter:grayscale(.7);opacity:.65;border-style:dashed;box-shadow:none}
.done .c{animation:none}
.done .c.today{animation:glow 2s ease-in-out infinite}
.pop{animation:pop .6s ease!important}
@keyframes pop{30%{transform:scale(1.3) rotate(-10deg)}60%{transform:scale(.94) rotate(7deg)}}
.shake{animation:shake .4s!important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;opacity:.85;margin-top:24px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,30,20,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:30px 20px 30px;border-radius:26px 26px 0 0;text-align:center;color:#1a3d2b;
background:repeating-linear-gradient(45deg,#d62839 0 10px,#fff 10px 20px) top/100% 9px no-repeat,#fff8ec;box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:sheet .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes sheet{from{transform:translateY(80px);opacity:0}}
.sheet>*{animation:up .6s both}
.sheet>:nth-child(2){animation-delay:.15s}.sheet>:nth-child(3){animation-delay:.3s}.sheet>:nth-child(4){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.sheet h2{margin:0 0 14px;font:700 24px Georgia,serif;color:#b3202f}
.sheet img{width:100%;border-radius:16px;margin-bottom:14px;display:block;animation:reveal 1.1s .15s both;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@keyframes reveal{from{filter:blur(16px);transform:scale(1.12);opacity:0}}
.sheet p{white-space:pre-wrap;font-size:18px;line-height:1.5;margin:0 0 20px}
button{width:100%;border:0;border-radius:14px;padding:15px;font:600 16px system-ui;color:#fff;background:linear-gradient(135deg,#e8405f,#b3202f);box-shadow:0 3px 0 #7d1220}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas><canvas id="cf"></canvas>
<div class="frame"></div><div class="lights"></div><div class="drift"></div>
<div id="scroll"><main>
  <svg class="hero" viewBox="0 0 240 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="120" cy="124" rx="118" ry="8" fill="#fff"/>
    <!-- снеговик -->
    <path d="M32 84 L12 68 M78 84 L98 70" stroke="#7a4a21" stroke-width="3" stroke-linecap="round"/>
    <circle cx="55" cy="97" r="26" fill="#fff"/><circle cx="55" cy="60" r="19" fill="#fff"/>
    <rect x="37" y="38" width="36" height="5" rx="2.5" fill="#222"/><rect x="44" y="21" width="22" height="19" rx="2" fill="#222"/><rect x="44" y="32" width="22" height="4" fill="#d62839"/>
    <circle cx="49" cy="57" r="2.2" fill="#222"/><circle cx="61" cy="57" r="2.2" fill="#222"/><path d="M55 61 L70 65 L55 68Z" fill="#ff8c1a"/>
    <rect x="38" y="75" width="34" height="7" rx="3.5" fill="#d62839"/><rect x="62" y="78" width="7" height="16" rx="3" fill="#d62839"/>
    <circle cx="52" cy="95" r="2.4" fill="#222"/><circle cx="52" cy="105" r="2.4" fill="#222"/>
    <!-- ёлка -->
    <path d="M120 30 L103 64 H137Z" fill="#2ecc71"/><path d="M120 48 L99 88 H141Z" fill="#27ae60"/><path d="M120 68 L95 114 H145Z" fill="#1e9e52"/><rect x="116" y="114" width="8" height="9" fill="#7a4a21"/>
    <path d="M120 17 l2.8 6.5 6.8.6-5.2 4.5 1.6 6.7-6-3.7-6 3.7 1.6-6.7-5.2-4.5 6.8-.6z" fill="#f2c94c"/>
    <circle cx="113" cy="74" r="3" fill="#d62839"/><circle cx="127" cy="92" r="3" fill="#f2c94c"/><circle cx="114" cy="102" r="3" fill="#d62839"/><circle cx="123" cy="58" r="2.5" fill="#d62839"/>
    <!-- Дед Мороз -->
    <path d="M222 124 V52" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/><circle cx="222" cy="49" r="5.5" fill="#f2c94c"/>
    <path d="M158 122 Q156 82 170 74 H200 Q214 82 212 122Z" fill="#d62839"/>
    <rect x="156" y="114" width="58" height="9" rx="4.5" fill="#fff"/><rect x="182" y="76" width="6" height="40" fill="#fff"/>
    <rect x="160" y="98" width="50" height="7" fill="#222"/><rect x="179" y="96" width="12" height="11" rx="2" fill="#f2c94c"/>
    <circle cx="185" cy="60" r="15" fill="#ffd6b0"/>
    <path d="M169 62 Q171 96 185 98 Q199 96 201 62 Q185 72 169 62Z" fill="#fff"/><ellipse cx="185" cy="64" rx="9" ry="3.5" fill="#fff"/>
    <circle cx="179" cy="57" r="1.8" fill="#222"/><circle cx="191" cy="57" r="1.8" fill="#222"/><circle cx="185" cy="61" r="2.6" fill="#ff9aa2"/>
    <path d="M169 52 Q170 28 192 30 Q207 42 201 52Z" fill="#d62839"/><rect x="166" y="48" width="38" height="8" rx="4" fill="#fff"/><circle cx="199" cy="31" r="5" fill="#fff"/>
  </svg>
  <h1 id="h">Новогодний адвент-календарь</h1>
  <p class="about">Чтобы скрасить ожидание Нового года, я создал этот адвент-календарь 🎄 Каждый день тебя ждёт новое окошко, а подарки в нём могут быть самыми разными. Открывай только в свой день, иначе окошко пропадёт!</p>
  <div class="sub" id="sub"></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="grid" id="grid"></div>
  <div class="legend"><span>🎀 сегодня</span><span>✅ открыто</span><span>🔒 рано</span><span>💔 потеряно</span></div>
</main></div>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor("#0f6140"); tg.setBackgroundColor("#083d28"); tg.setBottomBarColor && tg.setBottomBarColor("#083d28"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch {}
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const inTg = !!tg.initData, KEY = "advent_opened";
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;

const store = {
  get: () => new Promise(r => {
    const fb = () => r(JSON.parse(localStorage.getItem(KEY) || "[]"));
    if (!inTg || !tg.CloudStorage) return fb();
    tg.CloudStorage.getItem(KEY, (e, v) => { try { e || !v ? fb() : r(JSON.parse(v)); } catch { fb(); } });
  }),
  set: arr => new Promise(r => {
    const s = JSON.stringify(arr); localStorage.setItem(KEY, s);
    if (inTg && tg.CloudStorage) tg.CloudStorage.setItem(KEY, s, () => r()); else r();
  })
};

const pad = x => String(x).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const day0 = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const nowStr = q.get("today") || ymd(new Date());
const label = n => { const t = new Date((day0(C.start) + n - 1) * 864e5); return pad(t.getUTCDate()) + "." + pad(t.getUTCMonth() + 1); };
const notify = m => inTg ? tg.showAlert(m) : alert(m);
const haptic = t => tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = {today: "🎀", opened: "✅", future: "🔒", missed: "💔"};

let C, opened = [];
const status = n => {
  if (opened.includes(n)) return "opened";
  const d = day0(nowStr) - (day0(C.start) + n - 1);
  return d < 0 ? "future" : d === 0 ? "today" : "missed";
};

function render() {
  let h = "";
  for (let n = 1; n <= C.days; n++) { const s = status(n);
    h += `<div class="c ${s}" data-n="${n}" style="--i:${n}"><span class="i">${ICON[s]}</span><b>${n}</b><small>${label(n)}</small></div>`; }
  $("grid").innerHTML = h;
  $("sub").textContent = `Открыто ${opened.length} из ${C.days}`;
  $("bar").style.width = (opened.length / C.days * 100) + "%";
  setTimeout(() => $("grid").classList.add("done"), 1200 + C.days * 28);
}

function show(n) {
  const c = (C.cells || {})[n] || {};
  const text = c.text || "Сегодня тебя ждёт сюрприз! Приходи ко мне 😉";
  $("sheet").innerHTML = `<h2>🎁 Окошко №${n}</h2>${c.photo ? `<img src="${esc(c.photo)}" onerror="this.remove()">` : ""}<p>${esc(text)}</p><button onclick="closeM()">Закрыть</button>`;
  $("m").classList.add("on");
}
const closeM = () => $("m").classList.remove("on");
$("m").onclick = e => { if (e.target.id === "m") closeM(); };

const wiggle = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

$("grid").onclick = e => {
  const el = e.target.closest(".c"); if (!el) return;
  const n = +el.dataset.n, s = status(n);
  if (s === "future") { haptic("error"); wiggle(el, "shake"); return notify(`Рано 🙈 Это окошко откроется ${label(n)}`); }
  if (s === "missed") { haptic("error"); wiggle(el, "shake"); return notify("💔 Это окошко было доступно только в свой день. Подарок потерян..."); }
  haptic("success");
  if (s === "today") {
    wiggle(el, "pop");
    const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
    opened.push(n); store.set(opened);
    setTimeout(() => { show(n); render(); $("grid").classList.add("done"); }, calm ? 0 : 550);
  } else show(n);
};

// ---- снег ----
const sc = $("snow"), sx = sc.getContext("2d"); let flakes = [];
function fit() { for (const c of [sc, $("cf")]) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; } }
fit(); addEventListener("resize", fit);
if (!calm) {
  for (let i = 0; i < 55; i++) flakes.push({x: Math.random(), y: Math.random(), r: .6 + Math.random() * 2, v: .0006 + Math.random() * .0013, d: Math.random() * 6});
  (function snow(t) {
    sx.clearRect(0, 0, sc.width, sc.height); sx.fillStyle = "rgba(255,255,255,.75)";
    for (const f of flakes) {
      f.y += f.v; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
      sx.beginPath(); sx.arc((f.x + Math.sin(t / 1500 + f.d) * .015) * sc.width, f.y * sc.height, f.r * devicePixelRatio, 0, 7); sx.fill();
    }
    requestAnimationFrame(snow);
  })(0);
}

// ---- конфетти ----
const cc = $("cf"), cx = cc.getContext("2d"); let bits = [], run = false;
function burst(x, y) {
  if (calm) return;
  const k = devicePixelRatio, col = ["#ffd77a", "#ff6b81", "#7bed9f", "#70a1ff", "#fff", "#ffa502"];
  for (let i = 0; i < 80; i++) { const a = Math.random() * 6.28, s = 3 + Math.random() * 8;
    bits.push({x: x * k, y: y * k, vx: Math.cos(a) * s * k, vy: (Math.sin(a) * s - 4) * k, w: (4 + Math.random() * 5) * k, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: col[i % 6], life: 1}); }
  if (!run) { run = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cc.width, cc.height);
  bits = bits.filter(b => b.life > 0 && b.y < cc.height + 30);
  for (const b of bits) {
    b.vy += .35 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.vx *= .985; b.rot += b.vr; b.life -= .008;
    cx.save(); cx.globalAlpha = Math.max(b.life, 0); cx.translate(b.x, b.y); cx.rotate(b.rot);
    cx.fillStyle = b.c; cx.fillRect(-b.w / 2, -b.w / 4, b.w, b.w / 2); cx.restore();
  }
  bits.length ? requestAnimationFrame(tick) : (run = false);
}

(async () => {
  C = await (await fetch("content.json?" + Date.now())).json();
  if (q.get("reset")) await store.set([]);
  opened = await store.get();
  render();
})();
</script>
</body>
</html>
